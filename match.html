<!doctype html>
<!-- First In moved to applyfirst.app on 2026-11-18. GitHub Pages cannot send a 301, so every old page is a stub:
     a canonical link (for search engines), a meta refresh and a JS redirect that keeps ?query and #hash
     (old installs open bye.html?v=<version> on uninstall, and the version must reach the new form). -->
<html lang="en"><head><meta charset="utf-8">
<title>First In has moved to applyfirst.app</title>
<link rel="canonical" href="https://applyfirst.app/match/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://applyfirst.app/match/">
<script>location.replace('https://applyfirst.app/match/' + location.search + location.hash);</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
</head><body style="font-family:system-ui,sans-serif;padding:24px">
<p>First In has moved to <a href="https://applyfirst.app/match/">applyfirst.app/match/</a>.</p>
</body></html>
